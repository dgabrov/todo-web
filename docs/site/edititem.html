<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>To-Do - Edit</title>

    <link href="static/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-sm bg-dark navbar-dark">
    <a routerLink="/" class="navbar-brand" href="#">To-Do</a>
    <ul class="navbar-nav mr-auto">
        <li class="nav-item">
            <a class="nav-link" href="#">Login</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="#">Logout</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="#">To-Do</a>
        </li>
    </ul>
</nav>

<div class="container-fluid">
    <div class="col-lg-6 col-md-6 col-12">
        <div class="row">
            <div class="col-12 form-group">
                <h1>Add Edit Item</h1>
            </div>
            <div class="col-12 form-group">
                <label for="iduser">User</label>
                <select name="user" id="iduser" class="form-control">
                    <option value="dgabrov">Daniel G</option>
                    <option value="work">Work</option>
                </select>
            </div>
            <div class="col-12 form-group">
                <label for="idname">Name</label>
                <input type="text" class="form-control" id="idname">
            </div>
            <div class="col-12 form-group">
                <label for="idcategory">Category</label>
                <input type="text" class="form-control" id="idcategory">
            </div>
            <div class="col-12 form-group">
                <label for="idflag">Category</label>
                <input type="checkbox" class="ml-2" id="idflag">
            </div>
            <div class="col-12 form-group">
                <label for="iddescription">Description</label>
                <textarea rows="5" class="form-control" id="iddescription"></textarea>
            </div>
            <div class="col-12 form-group">
                <button type="submit" class="btn btn-primary border">Submit</button>
                <button type="submit" class="btn btn-default border">Cancel</button>
            </div>
        </div>
    </div>
</div>

</body>
</html>
